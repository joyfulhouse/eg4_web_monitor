name: Home Assistant Validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # HASSFEST VALIDATION
  # ========================================

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        # HA 2026.11 ships pyserial and hassfest rejects core dependencies in
        # custom manifests; our 2026.10.x floor still needs it at runtime.
        # Remove when hacs.json reaches 2026.11.0 and pyserial leaves the manifest.
        run: >-
          docker run --rm
          --mount type=bind,source="${{ github.workspace }}",target=/github/workspace,readonly
          ghcr.io/home-assistant/hassfest@sha256:e5828f7e305518506d8b4e8346411357d68358531b761bd118fe6a1631feff44

  # ========================================
  # HACS VALIDATION
  # ========================================

  hacs-validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # Ignore specific checks if needed:
          # ignore: "brands"

  # ========================================
  # VALIDATION SUMMARY
  # ========================================

  validation-summary:
    name: ✅ Validation Summary
    runs-on: ubuntu-latest
    needs: [hassfest, hacs-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display summary
        run: |
          echo "========================================"
          echo "   HOME ASSISTANT VALIDATION COMPLETE"
          echo "========================================"
          echo ""
          echo "✅ Hassfest validation passed"
          echo "✅ HACS validation passed"
          echo ""
          echo "Version: $(grep -o '"version": "[^"]*"' custom_components/eg4_web_monitor/manifest.json | cut -d'"' -f4)"
          echo "Domain: $(grep -o '"domain": "[^"]*"' custom_components/eg4_web_monitor/manifest.json | cut -d'"' -f4)"
          echo ""
          echo "Integration is ready for Home Assistant and HACS!"
