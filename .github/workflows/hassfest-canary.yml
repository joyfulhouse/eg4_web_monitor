name: Hassfest Latest Canary

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest-latest:
    name: Hassfest moving latest image (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run moving Hassfest image
        run: >-
          docker run --rm
          --mount type=bind,source="${{ github.workspace }}",target=/github/workspace,readonly
          ghcr.io/home-assistant/hassfest:latest
